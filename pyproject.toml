[project]
name = "ccc"
version = "0.1.0"
description = "My solutions for the Cloudflight Coding Contest, written in Python."
authors = [{ name = "Mario Kahlhofer", email = "mario.kahlhofer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "funcy>=2.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "networkx>=3.5",
    "numpy>=2.3.4",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = ["ipykernel>=7.1.0", "ruff>=0.14.5"]
